# Tool versions for local / CI / headless CLI work (render-cut, edit-lint, apps/cli).
# Install: `mise install`  —  run tools: `mise exec -- <cmd>`
#
# node: engines require >=20 (`packages/akari-launcher`). Pin current Node 22 LTS
#       rather than `latest` so shell / Electron-adjacent paths stay reproducible.
# ffmpeg: render-cut / edit-lint call ffmpeg and ffprobe directly. Pin to match
#         the version family already used in local verification (8.1.x).
# go: apps/cli (cobra + ConnectRPC). Match apps/cli/go.mod (>=1.26).
# buf: proto codegen (`buf generate` → apps/cli/gen). Lockfile pins per-platform checksums.
# golangci-lint / govulncheck: apps/cli CI（`.github/workflows/go-cli.yml`）。

[tools]
node = "22.23.1"
ffmpeg = "8.1.2"
go = "1.26.5"
buf = "1.72.0"
golangci-lint = "2.12.2"
"go:golang.org/x/vuln/cmd/govulncheck" = "v1.6.0"

[tasks.gen-proto]
description = "Generate ConnectRPC Go stubs from proto/"
run = "buf generate"

[tasks.bundle-orchestrator]
description = "Bundle Node orchestrator runtime into bin/akari-bundle"
run = "node scripts/bundle-orchestrator.mjs"

[tasks.build]
description = "Build self-contained akari CLI dist for host OS (dist/akari-<platform>/)"
run = "node scripts/build-release.mjs"

[tasks.build-linux]
description = "Build akari CLI dist for linux/amd64"
run = "node scripts/build-release.mjs --platform linux-x64"

[tasks.build-win64]
description = "Build akari CLI dist for windows/amd64"
run = "node scripts/build-release.mjs --platform win-x64"

[tasks.build-osx]
description = "Build akari CLI dist for macOS arm64 (Go cross-compile; shell needs macOS host)"
run = "node scripts/build-release.mjs --platform osx-arm64"

[tasks.build-shell]
description = "Build host CLI dist + Electron shell package (--with-shell)"
run = "node scripts/build-release.mjs --with-shell"

[tasks.build-shell-linux]
description = "Build linux CLI dist + Electron shell package"
run = "node scripts/build-release.mjs --platform linux-x64 --with-shell"

[tasks.build-shell-win64]
description = "Build windows CLI dist + Electron shell package (may need wine on Linux)"
run = "node scripts/build-release.mjs --platform win-x64 --with-shell"

[tasks.cli-test]
description = "Run Go CLI unit tests"
dir = "apps/cli"
run = "go test ./..."

[tasks.cli-lint]
description = "Lint Go CLI with golangci-lint"
dir = "apps/cli"
run = "golangci-lint run ./..."

[tasks.cli-vulncheck]
description = "Scan Go CLI dependencies with govulncheck"
dir = "apps/cli"
run = "govulncheck ./..."

# Deprecated aliases — prefer `build` / `build-linux` / `build-win64`.
[tasks.cli-build]
description = "Alias for build (host)"
depends = ["build"]

[tasks.cli-build-linux]
description = "Alias for build-linux"
depends = ["build-linux"]

[tasks.cli-build-windows]
description = "Alias for build-win64"
depends = ["build-win64"]

[tasks.orchestrator-test]
description = "Run Node orchestrator package tests"
dir = "packages/orchestrator"
run = "node --test test/*.test.mjs"
